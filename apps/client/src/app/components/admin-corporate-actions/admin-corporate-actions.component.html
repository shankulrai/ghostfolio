<div class="container">
  <div class="row">
    <div class="col">
      <h1 class="h3 mb-3" i18n>Corporate Actions</h1>

      @if (failedCount > 0 || stalePendingCount > 0) {
        <div class="mb-3">
          @if (failedCount > 0) {
            <div class="text-warning" i18n>
              Failed events: {{ failedCount }}
            </div>
          }
          @if (stalePendingCount > 0) {
            <div class="text-info" i18n>
              Stale pending events: {{ stalePendingCount }}
            </div>
          }
        </div>
      }

      <gf-corporate-actions-table [entries]="entries" [showCounts]="true" />

      @if (totalItems > pageSize) {
        <mat-paginator
          [hidePageSize]="true"
          [length]="totalItems"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          (page)="onChangePage($event)"
        />
      }
    </div>
  </div>
</div>
